name: Build cinematic hero video

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-hero-video.yml"
      - "scripts/generate-hero-video.sh"
      - "images/IMG_1415.jpg"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: aab-hero-video-main
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install ffmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg

      - name: Render seamless hero loop
        run: |
          chmod +x scripts/generate-hero-video.sh
          scripts/generate-hero-video.sh images/IMG_1415.jpg media

      - name: Commit generated web assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add media/aab-hero-parallax.mp4 media/aab-hero-parallax.webm
          if git diff --cached --quiet; then
            echo "Hero assets already current."
            exit 0
          fi
          git commit -m "feat: render cinematic hero video assets"
          # Other site edits may land while ffmpeg renders. Rebase the generated
          # asset commit onto the latest main so the automation never overwrites work.
          git pull --rebase origin main
          git push origin HEAD:main
