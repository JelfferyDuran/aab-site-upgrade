name: AAB CI

on:
  pull_request:
    paths:
      - "allaspectsbarn/**"
      - ".github/workflows/aab-ci.yml"
  push:
    branches:
      - main
    paths:
      - "allaspectsbarn/**"
      - ".github/workflows/aab-ci.yml"

concurrency:
  group: aab-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: allaspectsbarn

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: allaspectsbarn/package-lock.json

      - name: Restore Next.js build cache
        uses: actions/cache@v4
        with:
          path: allaspectsbarn/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('allaspectsbarn/package-lock.json') }}-${{ hashFiles('allaspectsbarn/src/**/*.[jt]s', 'allaspectsbarn/src/**/*.[jt]sx', 'allaspectsbarn/src/**/*.css', 'allaspectsbarn/next.config.ts') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('allaspectsbarn/package-lock.json') }}-

      - name: Install dependencies
        run: npm ci
        env:
          HUSKY: 0

      - name: Validate source and content
        run: npm run check:quick

      - name: Production build
        run: npm run build
